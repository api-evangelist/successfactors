aid: successfactors
name: Successfactors
description: >-
  SuccessFactors is a cloud-based human capital management (HCM) company founded in 2001 and
  an early Canaan Partners portfolio company that IPO'd in 2007 and was acquired by SAP in 2012.
  It is now delivered as the SAP SuccessFactors HXM (Human Experience Management) Suite, covering
  core HR (Employee Central), Recruiting, Onboarding, Performance & Goals, Compensation, Learning
  (LMS), Succession & Development, and Workforce Analytics. SuccessFactors exposes an extensive
  integration surface through OData v2 and OData v4 APIs (the SFAPI/OData platform) documented on
  the SAP Business Accelerator Hub, using OAuth 2.0 SAML bearer-assertion and basic authentication
  per customer datacenter instance.
